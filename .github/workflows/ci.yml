name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install --only-binary :all: --require-hashes -r requirements-ci.lock
      - name: Run unit and API tests (InMemoryStore, BM25 + NLU + Citation Grounding)
        env:
          RAG_ENABLE_DENSE: "0"
        run: pytest -v tests/test_pipeline.py

  test-pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: turkish_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pgvector test dependencies
        run: pip install --only-binary :all: --require-hashes -r requirements-ci.lock
      - name: Run live PostgreSQL 16 + pgvector integration tests
        env:
          DATABASE_URL: postgresql://rag:rag_password@127.0.0.1:5432/turkish_rag
          RAG_ENABLE_DENSE: "0"
        run: pytest -v tests/test_pgvector.py
