services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: turkish_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d turkish_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-assistant:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - RAG_STORE_BACKEND=pgvector
      - DATABASE_URL=postgresql://rag:rag_password@postgres:5432/turkish_rag
      - RAG_ENABLE_DENSE=1
      - RAG_EMBEDDING_MODEL=intfloat/multilingual-e5-small
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:4b
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
